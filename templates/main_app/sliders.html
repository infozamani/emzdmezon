			<div class="block-slideshow block-slideshow--layout--full block">
				<div class="container">
					<div class="row">
						<div class="col-12">
							<div class="block-slideshow__body">
								<div class="owl-carousel">
                                    {% for slide in sliders %}
                                        <a class="block-slideshow__slide" href="{{silde.slider_link}}" target="_blank">
                                            <div class="block-slideshow__slide-image block-slideshow__slide-image--desktop"
                                                style="background-image: url('{{media_url}}{{slide.image_title}}">
                                            </div>
                                            
                                            <div class="block-slideshow__slide-content">
                                                <div class="block-slideshow__slide-title">
                                                {% if slide.slider_title1 %}
                                                    {{slide.slider_title1 }}
                                                {% endif %}
                                                </div>
                                                <div class="block-slideshow__slide-text">
                                                {% if slide.slider_title2 %}
                                                        {{slide.slider_title2 }}
                                                {% endif %}
                                                </div>
                                                <div class="block-slideshow__slide-text">
                                                    <br />
                                                        {% if slide.slider_title3 %}
                                                            {{slide.slider_title3 }}
                                                        {% endif %}
                                                </div>
                                            </div>
									    </a>
                                    {% endfor %}
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
