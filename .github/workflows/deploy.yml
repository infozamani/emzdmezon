name: Deploy to Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Deploy to server via SSH
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "=== Starting Deployment ==="
            
            # Go to project directory
            cd /home/cp65771/sanatpoya
            
            # Pull latest changes
            echo "Pulling latest code..."
            git pull origin main
            
            # Activate virtualenv and install requirements
            echo "Installing dependencies..."
            source venv/bin/activate
            pip install -r requirements.txt
            
            # Run migrations
            echo "Running migrations..."
            python manage.py migrate
            
            # Collect static files
            echo "Collecting static files..."
            python manage.py collectstatic --noinput
            
            # Restart application (method depends on your setup)
            echo "Restarting application..."
            
            # Method 1: If using Passenger WSGI (common in cPanel)
            touch /home/cp77561/sanatpoya/passenger_wsgi.py
            
            # Method 2: If using a process manager like supervisor
            # supervisorctl restart sanatpoya
            
            # Method 3: If using systemd
            # sudo systemctl restart gunicorn
            
            echo "=== Deployment Complete ==="